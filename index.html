<html lang="pt-BR">
<head>

<title>Financeira EBS · Gestão de crédito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: fixed navy sidebar + scrolling work area; sidebar collapses to a top bar on phones. Single light theme, EBS brand. */
:root{
  --navy:#231F20; --azul:#0089C2; --azul-t:#E3F3FA; --laranja:#BF1E2E; --creme:#EAF6FB; --bg:#F4F4F3; --card:#FFFFFF;
  --ink:#231F20; --muted:#5F6878; --line:#E9E6DF;
  --ok:#13794A; --ok-t:#DDF4E8; --warn:#B4500F; --warn-t:#FCE9DA; --bad:#B42318; --bad-t:#FBE3E1; --info:#0E7FA6; --info-t:#E0F2F9;
  --f:'DM Sans',-apple-system,'Segoe UI',sans-serif; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);display:flex}
.sd{width:236px;background:var(--navy);color:#C9D1E3;display:flex;flex-direction:column;padding:22px 14px;gap:2px;flex-shrink:0;height:100%;box-sizing:border-box;position:sticky;top:0}
.sd .lg{color:var(--creme);width:96px;margin:0 0 2px 10px}.sd .lg svg{width:100%;display:block}
.sd .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7F8CA9;margin:6px 0 20px 10px}
.sd a{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:9px;color:#C9D1E3;text-decoration:none;font-weight:500}
.sd a:hover{background:#18243A}.sd a.on{background:var(--azul);color:#fff}
.sd a:focus-visible{outline:2px solid var(--creme)}
.sd a em{font-style:normal;background:var(--laranja);color:#fff;font-size:11px;padding:1px 8px;border-radius:99px}
.sd .tri{margin-top:auto;background:#17233A;border-radius:12px;padding:12px;font-size:12px;color:#9AA6C0}
.sd .tri .x{display:flex;align-items:center;gap:7px;margin-top:7px;color:#fff;font-weight:600}
.sd .tri .x i{width:8px;height:8px;border-radius:50%;background:#3DDC97;display:block}
.sd .tri svg{height:15px;width:auto}
main{flex:1;min-width:0;overflow:auto;height:100%;box-sizing:border-box;padding-block:24px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}.top .s{color:var(--muted);margin-top:2px}
.us{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.us i{width:34px;height:34px;border-radius:50%;background:var(--laranja);color:#fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.demo{display:inline-block;background:var(--creme);color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,24,38,.05)}
.k .h{font-size:12px;color:var(--muted)}.k .v{font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}.k .d{font-size:12px;color:var(--azul);margin-top:2px}
.pn{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,24,38,.05);min-width:0}
.pn h3{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pn h3 span{font-size:12px;color:var(--muted);font-weight:500}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #F1EFE9;white-space:nowrap}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover{background:#FAF9F6}
.tg{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.t-nova{background:var(--azul-t);color:var(--azul)}.t-ana{background:var(--info-t);color:var(--info)}.t-pend{background:var(--warn-t);color:var(--warn)}.t-ok{background:var(--ok-t);color:var(--ok)}.t-bad{background:var(--bad-t);color:var(--bad)}.t-cin{background:#ECEAE5;color:#555}
.wa{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-size:12.5px}.wa:before{content:"";width:8px;height:8px;border-radius:50%;background:#25D366}
.flt{display:flex;gap:6px;flex-wrap:wrap}.flt button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 11px;border-radius:99px;background:#F1EFEA;color:var(--muted)}.flt button.on{background:var(--navy);color:#fff}
.ck{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #F1EFE9}.ck:last-child{border:0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.dl span{display:block;font-size:11.5px;color:var(--muted)}.dl b{font-size:14.5px;font-variant-numeric:tabular-nums}
.bt{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
.bt:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.bp{background:var(--azul);color:#fff}.bo{border:1.5px solid #D8D4CB;color:var(--ink)}.br{border:1.5px solid #F2B8B3;color:var(--bad)}
.bt[aria-disabled="true"]{opacity:.45;cursor:default}
.sug{margin-top:12px;border-radius:10px;padding:12px 14px;font-size:13.5px}
.chat{background:#EFEAE2;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto}
.chat div{max-width:85%;padding:6px 9px;border-radius:8px;font-size:12.5px;background:#fff}.chat .o{align-self:flex-end;background:#D9FDD3}
.tl{display:flex;gap:0;margin:6px 0 2px}.tl div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:18px}
.tl div:before{content:"";position:absolute;top:4px;left:50%;width:12px;height:12px;border-radius:50%;background:#D8D4CB;transform:translateX(-50%);z-index:1}
.tl div:after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#D8D4CB}.tl div:first-child:after{display:none}
.tl div.d:before,.tl div.d:after{background:var(--azul)}.tl div.d{color:var(--ink);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{font:inherit;border:1.5px solid #DCD8CF;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
.fld input:focus,.fld select:focus{outline:2px solid var(--azul);border-color:transparent}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.bar{height:10px;border-radius:99px;background:#EEEBE5;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%}
.sw{all:unset;cursor:pointer;width:38px;height:22px;border-radius:99px;background:#D8D4CB;position:relative;flex-shrink:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on:after{left:19px}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(15,24,38,.3);font-weight:500;z-index:20}
.mod{position:fixed;inset:0;background:rgba(15,24,38,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.mod .pp{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:26px 28px}
.mod h2{margin:0 0 4px;font-size:20px}.doc{font-size:13.5px;line-height:1.6;color:#333;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.doc p{margin:0 0 10px}
.svgc text{font-family:var(--f)}
@media (max-width:900px){body{display:block}.sd{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:4px}.sd .sub,.sd .tri{display:none}.sd .lg{width:70px;margin:0 10px 0 0}.sd a{padding:6px 10px;font-size:13px}
 main{height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.g2,.g2e,.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.sw:after{transition:none}}
</style>

   <tr><td>Até ${BRL(POL.alcAnalista)}</td><td>Financeiro da EBS</td><td>Diretoria</td></tr><tr><td>Até ${BRL(POL.alcDiretoria)}</td><td>Diretoria</td><td>Diretoria</td></tr><tr><td>Acima de ${BRL(POL.alcDiretoria)}</td><td>Diretoria e comitê</td><td>Comitê</td></tr></tbody></table></div></div>`;
V.contratos=()=>hdr('Contratos e CCBs','Emitidas e custodiadas na Trinus, acompanhadas daqui')+`
  <div class="kp"><div class="k"><div class="h">CCBs emitidas no mês</div><div class="v">${CCB.length+4}</div><div class="d">${mi(CCB.reduce((a,c)=>a+c.valor,0)+0.31e6)}</div></div><div class="k"><div class="h">Aguardando assinatura</div><div class="v">${CCB.filter(c=>c.st===0).length+1}</div><div class="d">link enviado no WhatsApp</div></div><div class="k"><div class="h">Saldo antigo a quitar</div><div class="v">${CCB.filter(c=>c.st===2).length}</div><div class="d">baixa no Sienge</div></div><div class="k"><div class="h">Custódia</div><div class="v">Trinus</div><div class="d">incluída na emissão</div></div></div>
  <div class="pn"><h3>Contratos<span>emissão · assinatura · quitação na SPE · carteira</span></h3><div class="tw"><table><thead><tr><th>Título</th><th>Comprador</th><th class="r">Valor</th><th>Tipo</th><th style="min-width:320px">Etapa</th><th></th></tr></thead><tbody>
  ${CCB.map((c,i)=>`<tr><td><b>CCB ${c.n}</b></td><td>${c.nome}</td><td class="r">${BRL(c.valor)}</td><td>${c.tipo}</td><td><div class="tl">${CST.map((l,j)=>`<div class="${j<=c.st?'d':''}">${l.replace(' na Trinus','')}</div>`).join('')}</div></td><td><button class="bt bo" data-ccb="${i}" style="padding:6px 12px">Ver CCB</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
V.carteira=()=>{const rows=[['Em dia',.962,'#0089C2'],['1 a 30 dias',.029,'#E0A100'],['31 a 90 dias',.009,'#BF1E2E'],['Acima de 90',0,'#555']];
  return hdr('Carteira e cobrança','Saldo, atraso e a régua que roda sozinha pelo WhatsApp')+`
  <div class="kp"><div class="k"><div class="h">Saldo da carteira</div><div class="v">R$ 4,6 mi</div><div class="d">40 contratos</div></div><div class="k"><div class="h">Recebido no mês</div><div class="v">R$ 92 mil</div><div class="d">98,4% do previsto</div></div><div class="k"><div class="h">Atraso 1 a 30</div><div class="v">2,9%</div><div class="d">R$ 133 mil</div></div><div class="k"><div class="h">Atraso acima de 30</div><div class="v">0,9%</div><div class="d">2 contratos</div></div><div class="k"><div class="h">Parcela muda no ano que vem?</div><div class="v">Não</div><div class="d">100% em parcela fixa</div></div></div>
  <div class="g2"><div class="pn"><h3>Régua de cobrança<span>ligue ou desligue cada etapa</span></h3><div class="tw"><table style="min-width:460px"><thead><tr><th>Quando</th><th>Ação</th><th>Canal</th><th>Ativa</th></tr></thead><tbody>
   ${REGUA.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].includes('WhatsApp')?'<span class="wa">'+r[2]+'</span>':r[2]}</td><td><button class="sw ${r[3]?'on':''}" data-rg="${i}" aria-label="Ativar ${r[0]}" aria-pressed="${r[3]}"></button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="pn"><h3>Saldo por situação<span>novembro</span></h3>${rows.map(r=>`<div style="display:flex;justify-content:space-between"><span>${r[0]}</span><b>${pct(r[1])}</b></div><div class="bar"><i style="width:${Math.max(r[1]*100,r[1]?2:0)}%;background:${r[2]}"></i></div>`).join('')}</div></div>`};
V.leads=()=>hdr('Leads e antecipações','Quem simulou e não seguiu, e quem pediu para antecipar. Um clique retoma a conversa no WhatsApp.')+`<div class="pn"><div class="tw"><table><thead><tr><th>Nome</th><th>O que fez</th><th>Origem</th><th>Quando</th><th>Situação</th><th></th></tr></thead><tbody>
  ${LEADS.map((l,i)=>`<tr><td><b>${l[0]}</b></td><td>${l[1]}</td><td>${l[2]==='WhatsApp'?'<span class="wa">WhatsApp</span>':l[2]}</td><td>${l[3]}</td><td><span class="tg ${l[4]==='Retomar'?'t-pend':l[4]==='Pago'?'t-ok':'t-cin'}">${l[4]}</span></td><td><button class="bt bo" data-lead="${i}" style="padding:6px 12px">Retomar no WhatsApp</button></td></tr>`).join('')}</tbody></table></div></div>`;
V.simulador=()=>hdr('Simulador','Para o financeiro e o corretor: parcela fixa, prazo e resultado da Financeira')+`
  <div class="g2e"><div class="pn"><h3>O saldo e a parcela</h3><div class="form">
  <div class="fld"><label for="s-v">Saldo com a construtora (R$)</label><input id="s-v" type="number" value="58700" step="1000"></div><div class="fld"><label for="s-p">Parcela que cabe (R$)</label><input id="s-p" type="number" value="2000" step="100"></div>
  <div class="fld"><label for="s-i">Juros (% a.m.)</label><input id="s-i" type="number" value="1.30" step="0.05"></div><div class="fld"><label for="s-m">Construtora recebe</label><select id="s-m"><option>Mês a mês, sem juros</option><option>À vista, com antecipação</option></select></div></div></div>
  <div class="pn" id="simOut"></div></div>`;
function simOut(){const F=+$('#s-v').value,P=+$('#s-p').value,i=+$('#s-i').value/100;let n=P>F*i?Math.ceil(-Math.log(1-F*i/P)/Math.log(1+i)):POL.prazo;n=Math.min(n,POL.prazo);
  const p=pmt(F,n,i),juros=p*n-F,ccb=F*POL.ccb/100;
  $('#simOut').innerHTML=`<h3>Contrato sugerido</h3><div class="k" style="box-shadow:none;padding:0 0 10px"><div class="h">Parcela fixa</div><div class="v" style="font-size:30px;color:var(--azul)">${BRL2(p)}</div></div>
   <div class="ck"><span>Prazo</span><b>${n} meses</b></div><div class="ck"><span>Comprador paga no total</span><b>${BRL2(p*n)}</b></div>
   <div class="ck"><span>Construtora recebe</span><b>${BRL2(F)} · ${$('#s-m').value.toLowerCase()}</b></div>
   <div class="ck"><span>Juros para a Financeira</span><b>${BRL2(juros)}</b></div><div class="ck"><span>Emissão da CCB na Trinus</span><b>${BRL2(ccb)}</b></div>
   <div class="ck"><span>Renda mínima (parcela até ${POL.rend}%)</span><b>${BRL2(p/(POL.rend/100))}</b></div>
   <button class="bt bp" style="margin-top:12px" id="toWa">Enviar proposta ao comprador pelo WhatsApp</button>`;
  $('#toWa').onclick=()=>toast('Proposta enviada ao comprador pelo WhatsApp')}
// ---------- navegação ----------
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class="pp" role="dialog" aria-modal="true">${html}<div style="text-align:right;margin-top:16px"><button class="bt bo" id="mx">Fechar</button></div></div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==='mx')m.remove()}}
function go(v){if(!V[v])v='solicitacoes';document.querySelectorAll('.sd a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));$('#nNovas').textContent=SOL.filter(s=>s.st==='nova').length;
  main.innerHTML=V[v]();main.scrollTop=0;bind(v)}
function bind(v){
  main.querySelectorAll('tr.cl').forEach(tr=>{const open=()=>{selected=tr.dataset.id;location.hash='analise';go('analise')};tr.onclick=open;tr.onkeydown=e=>{if(e.key==='Enter')open()}});
  main.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>{solFilter=b.dataset.f;go('solicitacoes')});
  const s=SOL.find(x=>x.id===selected);
  if($('#apr'))$('#apr').onclick=()=>{const c=calc(s);if(c.alc!=='Financeiro'){s.st='com';toast('Proposta enviada à '+c.alc.toLowerCase());return go('analise')}
    s.st='ok';s.just=true;CCB.unshift({n:'00'+(13+CCB.length),nome:s.nome,valor:c.F,tipo:(s.prod==='reneg'?'Renegociação':'Venda nova')+' · '+s.prazo+'x fixas',st:0,data:'Agora'});toast('Aprovada. CCB enviada para emissão na Trinus e link de assinatura enviado ao comprador');go('analise')};
  if($('#doc'))$('#doc').onclick=()=>{s.st='pend';toast('Pedido de documento enviado ao comprador pelo WhatsApp');go('analise')};
  if($('#rep'))$('#rep').onclick=()=>{s.st='bad';toast('Proposta reprovada. Comprador avisado pelo WhatsApp');go('analise')};
  main.querySelectorAll('[data-k]').forEach(inp=>inp.oninput=()=>{POL[inp.dataset.k]=+inp.value});
  main.querySelectorAll('[data-k]').forEach(inp=>inp.onchange=()=>toast('Política atualizada. As próximas análises já usam a nova regra'));
  main.querySelectorAll('[data-ccb]').forEach(b=>b.onclick=()=>{const c=CCB[+b.dataset.ccb];modal(`<h2>Cédula de Crédito Bancário nº ${c.n}</h2><div style="color:var(--muted)">${CST[c.st]} · ${c.data}</div><div class="doc">
    <p><b>Emitente:</b> ${c.nome}</p><p><b>Valor:</b> ${BRL(c.valor)} · <b>Condição:</b> ${c.tipo}</p><p><b>Emissão e custódia:</b> Trinus, pelo módulo CaaS. <b>Credora:</b> Financeira EBS.</p>
    <p><b>Encargos:</b> juros de ${POL.tx.toLocaleString('pt-BR',{minimumFractionDigits:2})}% ao mês, parcela fixa sem correção monetária. Parcelas pagas por boleto ou Pix.</p>
    <p><b>Destinação:</b> quitação do saldo do contrato de compra e venda com a SPE, que recebe da Financeira na forma combinada.</p>
    <p style="color:var(--muted);font-size:12.5px">Documento de demonstração, com dados fictícios. No sistema, esta tela abre o PDF original da cédula guardado na Trinus.</p></div>`)});
  main.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{const r=REGUA[+b.dataset.rg];r[3]=!r[3];b.classList.toggle('on',r[3]);b.setAttribute('aria-pressed',r[3]);toast(`Etapa "${r[0]}" ${r[3]?'ativada':'desativada'}`)});
  main.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>toast('Mensagem de retomada enviada para '+LEADS[+b.dataset.lead][0]));
  if(v==='simulador'){main.querySelectorAll('#s-v,#s-p,#s-i,#s-m').forEach(x=>x.oninput=simOut);simOut()}
}
document.querySelectorAll('.sd a').forEach(a=>a.onclick=e=>{go(a.dataset.v)});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go((location.hash||'#solicitacoes').slice(1));
</script>
